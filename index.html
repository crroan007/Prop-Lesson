<!DOCTYPE html>
<html lang="en">
<head>

<title>DA42 Propeller System — Ground School</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--sky:#1a73e8;--sky-light:#e8f0fe;--navy:#1b2a4a;--green:#1e8e3e;--green-bg:#e6f4ea;--red:#d93025;--red-bg:#fce8e6;--amber:#f9ab00;--amber-bg:#fef7e0;--bg:#f8f9fa;--white:#fff;--text:#202124;--text2:#5f6368;--border:#dadce0;--card-shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.06);--hover-shadow:0 4px 12px rgba(0,0,0,.1)}
html{scroll-behavior:smooth}
body{font-family:'DM Sans','Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.7}
#progress-bar{position:fixed;top:0;left:0;height:3px;background:var(--sky);z-index:1000;transition:width .3s}
header{position:fixed;top:3px;left:0;right:0;z-index:999;background:var(--white);border-bottom:1px solid var(--border);padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:56px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;color:var(--navy)}
.logo svg{width:28px;height:28px}
.nav-center{font-size:13px;color:var(--text2);font-weight:500}
.nav-center strong{color:var(--text)}
.nav-btns{display:flex;gap:8px}
.btn{padding:8px 18px;border-radius:6px;border:1px solid var(--border);background:var(--white);color:var(--text);font:600 13px 'DM Sans',sans-serif;cursor:pointer;transition:all .15s}
.btn:hover{background:var(--sky-light);border-color:var(--sky);color:var(--sky)}
.btn:disabled{opacity:.3;cursor:default}
.btn-primary{background:var(--sky);color:#fff;border-color:var(--sky)}
.btn-primary:hover{background:#1557b0;box-shadow:var(--hover-shadow)}
main{max-width:760px;margin:0 auto;padding:76px 20px 60px}
.module{margin-bottom:48px;animation:fadeUp .5s ease both}
.module:nth-child(2){animation-delay:.05s}.module:nth-child(3){animation-delay:.1s}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.module-label{display:inline-flex;align-items:center;gap:6px;background:var(--sky-light);color:var(--sky);padding:3px 10px;border-radius:4px;font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;margin-bottom:10px}
.module h2{font-family:'Inter',sans-serif;font-size:24px;font-weight:800;color:var(--navy);margin-bottom:6px}
.module .subtitle{font-size:15px;color:var(--text2);margin-bottom:24px}
.card{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:24px;margin-bottom:16px;box-shadow:var(--card-shadow);transition:box-shadow .2s}
.card:hover{box-shadow:var(--hover-shadow)}
.card h3{font-size:16px;font-weight:700;margin-bottom:8px;color:var(--navy)}
.card p,.card li{font-size:14px;color:var(--text2);line-height:1.75}
.card strong{color:var(--text)}
.analogy{background:var(--sky-light);border:1px solid #c5d9f2;border-left:4px solid var(--sky);border-radius:8px;padding:16px 20px;margin:16px 0}
.analogy .label{font-size:11px;font-weight:700;color:var(--sky);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.keyfact{background:var(--green-bg);border:1px solid #a8dab5;border-left:4px solid var(--green);border-radius:8px;padding:14px 18px;margin:16px 0;font-size:14px}
.keyfact strong{color:var(--green)}
.warning{background:var(--red-bg);border:1px solid #f5b7b1;border-left:4px solid var(--red);border-radius:8px;padding:14px 18px;margin:16px 0;font-size:14px}
.warning strong{color:var(--red)}
.note{background:var(--amber-bg);border:1px solid #f5d98e;border-left:4px solid var(--amber);border-radius:8px;padding:14px 18px;margin:16px 0;font-size:14px}
.quiz{background:var(--white);border:2px solid var(--sky);border-radius:12px;padding:24px;margin:24px 0;box-shadow:var(--card-shadow)}
.quiz-tag{display:inline-flex;align-items:center;gap:4px;background:var(--sky);color:#fff;padding:3px 10px;border-radius:4px;font-size:11px;font-weight:700;letter-spacing:.5px;margin-bottom:12px}
.quiz .q{font-size:15px;font-weight:600;margin-bottom:14px;color:var(--navy)}
.quiz .opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:center;gap:10px;padding:12px 16px;border:1px solid var(--border);border-radius:8px;cursor:pointer;font-size:14px;transition:all .15s}
.opt:hover{border-color:var(--sky);background:var(--sky-light)}
.opt .letter{width:26px;height:26px;border-radius:50%;background:var(--bg);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex-shrink:0}
.opt.correct{border-color:var(--green);background:var(--green-bg)}
.opt.correct .letter{background:var(--green);color:#fff;border-color:var(--green)}
.opt.wrong{border-color:var(--red);background:var(--red-bg)}
.opt.wrong .letter{background:var(--red);color:#fff;border-color:var(--red)}
.feedback{margin-top:12px;padding:12px 16px;border-radius:8px;font-size:13px;display:none}
.feedback.show{display:block;animation:fadeUp .2s ease}
.feedback.pass{background:var(--green-bg);border:1px solid #a8dab5;color:var(--green)}
.feedback.fail{background:var(--red-bg);border:1px solid #f5b7b1;color:var(--red)}
.img-wrap{margin:16px 0;border-radius:10px;overflow:hidden;border:1px solid var(--border);box-shadow:var(--card-shadow)}
.img-wrap img{width:100%;display:block}
.img-wrap .cap{padding:8px 14px;background:var(--bg);font-size:12px;color:var(--text2);text-align:center}
.flow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center;margin:16px 0}
.flow-box{background:var(--white);border:1px solid var(--border);border-radius:8px;padding:12px 16px;text-align:center;font-size:13px;box-shadow:var(--card-shadow);min-width:120px}
.flow-box .fl-title{font-weight:700;font-size:14px;color:var(--navy);margin-bottom:2px}
.flow-box .fl-sub{color:var(--text2);font-size:12px}
.flow-arrow{color:var(--sky);font-size:20px;font-weight:700}
.checklist{list-style:none;padding:0}
.checklist li{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--white);border:1px solid var(--border);border-radius:8px;margin-bottom:6px;font-size:14px;cursor:pointer;transition:all .15s}
.checklist li:hover{border-color:var(--sky)}
.checklist li.done{border-color:var(--green);background:var(--green-bg)}
.checklist .ck{width:20px;height:20px;border-radius:4px;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:11px;font-weight:700;transition:all .15s}
.checklist li.done .ck{background:var(--green);border-color:var(--green);color:#fff}
#scorebar{position:fixed;bottom:16px;right:16px;background:var(--white);border:1px solid var(--border);border-radius:8px;padding:8px 16px;box-shadow:var(--hover-shadow);font-size:13px;font-weight:600;z-index:998;display:flex;align-items:center;gap:8px}
.tts-bar{position:fixed;bottom:60px;right:16px;background:var(--sky);color:#fff;padding:6px 14px;border-radius:6px;font-size:12px;font-weight:600;display:none;z-index:999}
.tts-bar.on{display:flex;align-items:center;gap:8px}
.section-divider{height:1px;background:var(--border);margin:40px 0}
.steps{counter-reset:step}
.steps li{counter-increment:step;padding-left:36px;position:relative;margin-bottom:12px;font-size:14px;color:var(--text2);line-height:1.7}
.steps li::before{content:counter(step);position:absolute;left:0;top:2px;width:24px;height:24px;background:var(--sky);color:#fff;border-radius:50%;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
@media(max-width:600px){main{padding:64px 14px 40px}.card{padding:18px}.quiz{padding:18px}}
</style>
</head>

<main id="main">
<!-- CONTENT INJECTED BY JS -->
</main>

<script>
const MODULES=[
// ---- MODULE 1: Welcome ----
{title:"Welcome Aboard",sub:"Course overview and objectives",label:"START",speak:"Welcome to the DA42 propeller system course. This lesson will take you through everything you need to understand about how the propeller works on the DA42 twin. We'll build from the basics up to emergency procedures. Let's get started.",html:`
<div class="card"><h3>What You'll Master</h3>
<ul class="checklist" id="obj">
<li onclick="ck(this)"><span class="ck"></span>What pitch means and why it matters</li>
<li onclick="ck(this)"><span class="ck"></span>How FADEC controls RPM automatically</li>
<li onclick="ck(this)"><span class="ck"></span>MT propeller construction & preflight</li>
<li onclick="ck(this)"><span class="ck"></span>The oil-based pitch control system</li>
<li onclick="ck(this)"><span class="ck"></span>Emergency: oscillating RPM, overspeed, fixed RPM</li>
<li onclick="ck(this)"><span class="ck"></span>Engine failure memory items & restarts</li>
</ul></div>
<div class="card"><h3>How This Course Works</h3>
<p>Each module covers <strong>one concept</strong>. You'll get an <strong>analogy</strong> first to build intuition, then the technical detail, then a <strong>knowledge check</strong> to lock it in. Use the 🔊 <strong>Narrate</strong> button to hear each section read aloud.</p>
<p style="margin-top:8px">This course is designed for learners who learn best with multiple approaches — reading, listening, visuals, and active recall.</p></div>
<div class="img-wrap"><img src="https://upload.wikimedia.org/wikipedia/commons/thumb/a/a7/Diamond_DA42_Twin_Star_%28VH-YEW%29_at_Wagga_Wagga_Airport.jpg/1280px-Diamond_DA42_Twin_Star_%28VH-YEW%29_at_Wagga_Wagga_Airport.jpg" alt="DA42"><div class="cap">Diamond DA42 Twin Star — the aircraft you're learning about</div></div>`},

// ---- MODULE 2: What Is Pitch? ----
{title:"What Is Propeller Pitch?",sub:"The angle of the blade — and why it changes everything",label:"CONCEPT",speak:"Propeller pitch is the angle of the blade relative to the plane of rotation. Think of it like scooping water with your hand. A flat hand slicing through water feels easy but moves little water. Cup your hand and you grab a lot of water but it takes more effort. That is pitch. A fine pitch blade takes a small bite of air at high RPM. A coarse pitch blade takes a big bite at lower RPM.",html:`
<div class="analogy"><div class="label">Analogy — Scooping Water</div>
<p>Hold your hand flat and drag it through water. Easy, right? Now cup your hand — you grab way more water, but it's harder. That's <strong>pitch</strong>.</p>
<p style="margin-top:8px"><strong>Flat hand</strong> = fine pitch = small bite, high RPM, great for takeoff.<br><strong>Cupped hand</strong> = coarse pitch = big bite, lower RPM, efficient for cruise.</p></div>
<div class="card"><h3>Technical Definition</h3>
<p><strong>Pitch</strong> is the angle between the blade's chord line and the plane of rotation. The DA42's pitch varies from about <strong>12° (fine)</strong> to <strong>90° (feathered)</strong>.</p></div>
<div class="keyfact">💡 <strong>Fine pitch</strong> = small angle = small bite of air = high RPM.<br><strong>Coarse pitch</strong> = big angle = big bite of air = lower RPM.</div>
<div class="quiz" id="q1"><div class="quiz-tag">✓ Knowledge Check</div>
<p class="q">A propeller blade at fine pitch takes a _____ bite of air and spins at _____ RPM.</p>
<div class="opts">
<div class="opt" onclick="ans(this,'q1',0)"><span class="letter">A</span>Large bite, low RPM</div>
<div class="opt" onclick="ans(this,'q1',1)"><span class="letter">B</span>Small bite, high RPM</div>
<div class="opt" onclick="ans(this,'q1',0)"><span class="letter">C</span>Large bite, high RPM</div>
</div><div class="feedback" id="q1f"></div></div>`},

// ---- MODULE 3: Fixed vs Variable ----
{title:"Fixed vs Variable Pitch",sub:"Why the DA42 uses variable pitch propellers",label:"CONCEPT",speak:"If you have ever ridden a bicycle, you understand fixed versus variable pitch. A fixed pitch propeller is like a bike stuck in one gear. In third gear, starting from a stop is exhausting. Cruising at ten miles per hour feels right. But trying to go twenty? You are pedaling furiously and barely accelerating. A variable pitch propeller is like having a full set of gears. First gear to start, third to climb, fifth to cruise. The DA42 has variable pitch so the blade angle adjusts for every phase of flight.",html:`
<div class="analogy"><div class="label">Analogy — The Bicycle</div>
<p>Imagine a bike with <strong>only one gear — third</strong>.</p>
<p style="margin-top:6px">🚲 <strong>Starting from a stop:</strong> Brutal. You're pushing hard and barely moving.<br>
🚲 <strong>At 10 mph:</strong> Feels perfect — this gear was made for this speed.<br>
🚲 <strong>Going 20 mph:</strong> Your legs are spinning like crazy but you're barely going faster.</p>
<p style="margin-top:8px">That's a <strong>fixed pitch</strong> propeller — great at one speed, terrible at the rest.</p>
<p style="margin-top:8px">Now imagine a <strong>21-speed bike</strong>. Low gear to start, shift up as you go. You always have the right gear. That's <strong>variable pitch</strong>.</p></div>
<div class="card"><h3>Why Variable Pitch Matters</h3>
<p><strong>Takeoff:</strong> Fine pitch (low gear) — small bite, high RPM, maximum thrust to accelerate.<br>
<strong>Climb:</strong> Medium pitch — balancing RPM and thrust.<br>
<strong>Cruise:</strong> Coarse pitch (high gear) — big bite, efficient fuel burn at lower RPM.</p></div>
<div class="keyfact">💡 The DA42 has <strong>variable pitch, feathering propellers</strong>. The blade angle adjusts automatically for every phase of flight.</div>
<div class="quiz" id="q2"><div class="quiz-tag">✓ Knowledge Check</div>
<p class="q">A fixed pitch propeller is like a bicycle stuck in one gear. What is the main disadvantage?</p>
<div class="opts">
<div class="opt" onclick="ans(this,'q2',1)"><span class="letter">A</span>It's only efficient at one airspeed — poor performance everywhere else</div>
<div class="opt" onclick="ans(this,'q2',0)"><span class="letter">B</span>It weighs more than a variable pitch propeller</div>
<div class="opt" onclick="ans(this,'q2',0)"><span class="letter">C</span>It cannot generate thrust at high altitude</div>
</div><div class="feedback" id="q2f"></div></div>`},

// ---- MODULE 4: Feathering ----
{title:"What Is Feathering?",sub:"The emergency position that saves your life",label:"CONCEPT",speak:"Feathering means turning the blade edge-on to the wind, like a knife cutting through the air. In an engine failure, a windmilling propeller creates enormous drag. Feathering eliminates that drag. Think of holding a playing card out a car window. Flat to the wind, it jerks your hand back. Turn it edge-on and it slices through. That is the difference between a windmilling prop and a feathered one.",html:`
<div class="analogy"><div class="label">Analogy — Playing Card Out a Car Window</div>
<p>Hold a <strong>playing card flat</strong> out a car window at 60 mph. The wind tears at it — massive drag.</p>
<p style="margin-top:6px">Now <strong>turn it edge-on</strong>. It slices through the air like nothing.</p>
<p style="margin-top:6px">A <strong>windmilling prop</strong> = card flat = enormous drag pulling you toward the dead engine.<br>A <strong>feathered prop</strong> = card edge-on = almost no drag.</p></div>
<div class="card"><h3>When Do We Feather?</h3>
<p>Whenever an engine fails or must be shut down in flight. Feathering puts the blade at approximately <strong>90°</strong> — parallel to the oncoming airflow. This dramatically reduces drag and allows you to maintain control on the remaining engine.</p></div>
<div class="warning">⚠️ <strong>Critical:</strong> Failure to feather an inoperative engine's propeller can make the aircraft uncontrollable. This is not optional — it's a survival action.</div>
<div class="quiz" id="q3"><div class="quiz-tag">✓ Knowledge Check</div>
<p class="q">What does feathering a propeller do?</p>
<div class="opts">
<div class="opt" onclick="ans(this,'q3',0)"><span class="letter">A</span>Increases thrust on the failed engine</div>
<div class="opt" onclick="ans(this,'q3',0)"><span class="letter">B</span>Locks the propeller from spinning</div>
<div class="opt" onclick="ans(this,'q3',1)"><span class="letter">C</span>Aligns the blade edge-on to airflow, minimizing drag</div>
</div><div class="feedback" id="q3f"></div></div>`},

// ---- MODULE 5: FADEC ----
{title:"FADEC — Your Automatic Transmission",sub:"How the DA42 eliminates manual RPM control",label:"SYSTEM",speak:"In most twin engine airplanes, the pilot uses blue levers to manually set RPM. The DA42 does not have blue levers. Instead it has FADEC — Full Authority Digital Engine Control. Think of driving an automatic transmission car. You press the gas pedal to a certain depth and the car figures out what gear to be in. Same thing here. You set the power lever to a percentage and the ECU calculates the correct RPM from a set point curve. At sixty percent power, the target is 1980 RPM.",html:`
<div class="analogy"><div class="label">Analogy — Automatic vs Manual Car</div>
<p>Most twins = <strong>manual transmission</strong>. The pilot picks the gear (RPM) with blue levers.</p>
<p style="margin-top:6px">The DA42 = <strong>automatic transmission</strong>. You push the gas pedal (power lever) and the car (ECU) picks the perfect gear for you.</p></div>
<div class="card"><h3>How FADEC Works</h3>
<div class="flow">
<div class="flow-box"><div class="fl-title">You Set</div><div class="fl-sub">Power lever %</div></div>
<div class="flow-arrow">→</div>
<div class="flow-box"><div class="fl-title">ECU Calculates</div><div class="fl-sub">Target RPM</div></div>
<div class="flow-arrow">→</div>
<div class="flow-box"><div class="fl-title">Governor Adjusts</div><div class="fl-sub">Blade pitch</div></div>
</div>
<p style="margin-top:12px">Diamond publishes a <strong>propeller set point curve</strong>. At <strong>60% power</strong>, the target is <strong>1,980 RPM</strong>. The system adjusts blade pitch automatically to maintain that RPM.</p></div>
<div class="keyfact">💡 <strong>No blue levers.</strong> The pilot only sets power lever position. The ECU + governor handle RPM automatically.</div>
<div class="quiz" id="q4"><div class="quiz-tag">✓ Knowledge Check</div>
<p class="q">In the DA42, who controls the RPM?</p>
<div class="opts">
<div class="opt" onclick="ans(this,'q4',0)"><span class="letter">A</span>The pilot, using blue RPM levers</div>
<div class="opt" onclick="ans(this,'q4',1)"><span class="letter">B</span>The ECU, based on the power lever position</div>
<div class="opt" onclick="ans(this,'q4',0)"><span class="letter">C</span>The copilot, using a separate RPM control</div>
</div><div class="feedback" id="q4f"></div></div>`},

// ---- MODULE 6: MT Propeller ----
{title:"The MT Propeller — Construction & Preflight",sub:"What it's made of and how to inspect it",label:"HARDWARE",speak:"The MT propeller is three bladed, made of wood composite with reinforced plastic coating. The leading edges are stainless steel for durability. There is a rubber strip for deice fluid. The spinner is aluminum. Important: push the prop blades to move the aircraft, never push the spinner. During preflight, run your hand along the leading edge to feel for nicks or damage. The AFM warns against high RPM on the ground because debris can damage the blades. Both engines rotate clockwise from the pilot's perspective, making this a conventional twin with the left engine as the critical engine.",html:`
<div class="card"><h3>Construction</h3>
<p>• <strong>3 blades</strong> — wood composite core with reinforced plastic coating<br>
• <strong>Leading edges:</strong> stainless steel (durable against erosion)<br>
• <strong>De-ice:</strong> rubber strip channels TKS fluid to the leading edges<br>
• <strong>Spinner:</strong> aluminum — <strong>never push the spinner</strong> to move the aircraft</p></div>
<div class="analogy"><div class="label">Preflight Mindset</div>
<p>Run your hand along each leading edge during preflight. Yes, a nick might cut you. But it is far better to <strong>find damage on the ground</strong> than to discover it in flight. Think of it as shaking hands with your propeller — you want to know it's healthy before you trust it with your life.</p></div>
<div class="warning">⚠️ <strong>AFM Caution:</strong> Avoid high RPM on the ground. Stones and debris can be sucked up and damage the leading edges.</div>
<div class="card"><h3>Conventional Twin</h3>
<p>Both engines rotate <strong>clockwise</strong> (from the pilot's seat). Same engine, same direction = <strong>conventional twin</strong>.</p>
<p style="margin-top:6px">This means the <strong>left engine is the critical engine</strong> — the one whose failure most affects controllability. Remember <strong>PAST</strong>: P-factor, Accelerated slipstream, Spiraling slipstream, Torque.</p></div>
<div class="quiz" id="q5"><div class="quiz-tag">✓ Knowledge Check</div>
<p class="q">Why is the left engine the critical engine on the DA42?</p>
<div class="opts">
<div class="opt" onclick="ans(this,'q5',1)"><span class="letter">A</span>Both propellers rotate clockwise — losing the left engine has the greatest adverse effect</div>
<div class="opt" onclick="ans(this,'q5',0)"><span class="letter">B</span>The left engine produces more power</div>
<div class="opt" onclick="ans(this,'q5',0)"><span class="letter">C</span>The propellers counter-rotate, and the left has more P-factor</div>
</div><div class="feedback" id="q5f"></div></div>`},

// ---- MODULE 7: Control System ----
{title:"How Pitch Is Controlled",sub:"The brain, the muscle, and the backup systems",label:"SYSTEM",speak:"Think of the system as a body. The ECU is the brain — it knows the target RPM. The governor is the muscle — it pumps gearbox oil into the propeller hub. More oil pressure pushes blades to fine pitch for takeoff. Less oil pressure lets blades move to coarse pitch for cruise. No oil at all means feathered. Counterweights on each blade naturally push toward coarse or feathered, which is the safe direction. Low pitch stop pins prevent feathering below 1300 RPM. The gearbox derates engine speed by 1.69 to 1. And the RPM on your EIS is propeller RPM, not engine RPM.",html:`
<div class="analogy"><div class="label">Analogy — Brain and Muscle</div>
<p><strong>ECU = Brain.</strong> It knows what power you've set and calculates the target RPM.<br>
<strong>Governor = Muscle.</strong> It physically pumps oil to move the blades to the right angle.</p></div>
<div class="card"><h3>Oil Pressure Controls Everything</h3>
<div class="flow">
<div class="flow-box" style="border-color:var(--sky)"><div class="fl-title">⬆ More Oil</div><div class="fl-sub">Fine pitch → Takeoff</div></div>
<div class="flow-box" style="border-color:var(--amber)"><div class="fl-title">⬇ Less Oil</div><div class="fl-sub">Coarse pitch → Cruise</div></div>
<div class="flow-box" style="border-color:var(--red)"><div class="fl-title">🚫 No Oil</div><div class="fl-sub">Feathered → Engine out</div></div>
</div></div>
<div class="card"><h3>Safety Backup: Counterweights</h3>
<p>Centrifugal force naturally pushes spinning blades toward <strong>flat (fine pitch)</strong> — the worst position in an engine failure (max drag).</p>
<p style="margin-top:6px">To counteract this, each blade has a <strong>counterweight</strong> at its base that pushes toward <strong>coarse/feathered</strong> — the safe direction.</p></div>
<div class="keyfact">💡 <strong>Low pitch stop pins</strong> prevent feathering below <strong>1,300 RPM</strong>. That's why the props don't fully feather when you shut down on the ground.</div>
<div class="card"><h3>Gearbox Quick Facts</h3>
<p>• Derates engine speed to prop speed: <strong>1.69 : 1</strong> ratio<br>
• Governor uses <strong>gearbox oil</strong> (check through sight glass on preflight)<br>
• Your EIS displays <strong>propeller RPM</strong>, not engine RPM</p></div>
<div class="quiz" id="q6"><div class="quiz-tag">✓ Knowledge Check</div>
<p class="q">What happens when oil pressure in the propeller hub increases?</p>
<div class="opts">
<div class="opt" onclick="ans(this,'q6',1)"><span class="letter">A</span>Blades go to fine pitch (takeoff setting)</div>
<div class="opt" onclick="ans(this,'q6',0)"><span class="letter">B</span>Blades go to coarse pitch (cruise setting)</div>
<div class="opt" onclick="ans(this,'q6',0)"><span class="letter">C</span>Blades feather</div>
</div><div class="feedback" id="q6f"></div></div>
<div class="quiz" id="q7"><div class="quiz-tag">✓ Knowledge Check</div>
<p class="q">Why don't the propellers fully feather when you shut down on the ground?</p>
<div class="opts">
<div class="opt" onclick="ans(this,'q7',0)"><span class="letter">A</span>The counterweights prevent it</div>
<div class="opt" onclick="ans(this,'q7',1)"><span class="letter">B</span>Low pitch stop pins engage below 1,300 RPM</div>
<div class="opt" onclick="ans(this,'q7',0)"><span class="letter">C</span>The accumulator holds pressure</div>
</div><div class="feedback" id="q7f"></div></div>`},

// ---- MODULE 8: Accumulator ----
{title:"The Pressure Accumulator",sub:"How the prop feathers and unfeathers",label:"SYSTEM",speak:"The pressure accumulator, also called the unfeathering accumulator, stores pressurized gearbox oil in a nitrogen-charged cylinder. When you turn the engine master ON, the accumulator releases oil to push the prop out of feather. To feather, pull the power lever to idle first, then turn the engine master OFF. The electric governor valve opens, oil drains from the hub, counterweights push the blades to feathered, and the accumulator stores oil for next time. Order matters: idle first, then master off.",html:`
<div class="analogy"><div class="label">Analogy — A Pressurized Fire Extinguisher</div>
<p>The accumulator is like a small fire extinguisher pre-charged with nitrogen. Squeeze the handle (engine master ON) and it releases pressurized oil to push the prop out of feather. Release the handle (engine master OFF), and the system recharges for next time.</p></div>
<div class="card"><h3>Feather / Unfeather Sequence</h3>
<p><strong style="color:var(--green)">To UNFEATHER</strong> (engine master ON):</p>
<ol class="steps"><li>Turn Engine Master ON</li><li>Accumulator releases pressurized oil into prop hub</li><li>Oil pressure pushes blades out of feather</li></ol>
<p style="margin-top:16px"><strong style="color:var(--red)">To FEATHER</strong> (shutting down):</p>
<ol class="steps"><li>Pull power lever to <strong>IDLE</strong> first</li><li>Turn Engine Master <strong>OFF</strong></li><li>Electric governor valve opens → oil drains from hub</li><li>Counterweights push blades to feathered position</li><li>Accumulator closes and stores oil</li></ol></div>
<div class="warning">⚠️ <strong>Order matters!</strong> Power lever to IDLE <strong>first</strong>, then Engine Master OFF. Get this backwards and the prop may not feather properly.</div>
<div class="quiz" id="q8"><div class="quiz-tag">✓ Knowledge Check</div>
<p class="q">To feather the propeller during shutdown, the correct sequence is:</p>
<div class="opts">
<div class="opt" onclick="ans(this,'q8',0)"><span class="letter">A</span>Engine Master OFF, then power lever to idle</div>
<div class="opt" onclick="ans(this,'q8',1)"><span class="letter">B</span>Power lever to IDLE first, then Engine Master OFF</div>
<div class="opt" onclick="ans(this,'q8',0)"><span class="letter">C</span>Fuel selector OFF, then alternator OFF</div>
</div><div class="feedback" id="q8f"></div></div>`},

// ---- MODULE 9: Emergency Procedures ----
{title:"Emergency Procedures",sub:"Defective RPM, engine failure, and restarts",label:"EMERGENCY",speak:"Three propeller emergencies. Oscillating RPM: change power, check ECU failure, switch ECU, land. Propeller overspeed: maximum 2500 RPM for 20 seconds. Reduce power, check and switch ECU, land. Fixed RPM: same drill. For engine failure below 3000 feet, these are memory items. Power lever max. Maintain directional control. Airspeed to VSC. Gear up. Flaps up. Secure the engine. Identify dead foot dead engine. Verify by pulling throttle back. Fix by turning engine master off which feathers the prop. Secure alternator off, fuel pump off, fuel selector off.",html:`
<div class="card" style="border-left:4px solid var(--red)"><h3>🔄 Oscillating RPM</h3>
<ol class="steps"><li>Change power setting — RPM may stabilize at a different setting</li><li>Check for ECU failure indication (A or B)</li><li>Switch to the other ECU if failure detected</li><li>If unresolved → <strong>land at nearest suitable airfield</strong></li></ol></div>
<div class="card" style="border-left:4px solid var(--red)"><h3>⚡ Propeller Overspeed</h3>
<div class="warning">⚠️ <strong>Limit: 2,500 RPM maximum for 20 seconds</strong></div>
<ol class="steps"><li>Reduce power immediately</li><li>Check for ECU failure</li><li>Switch ECU (A↔B)</li><li>If unresolved → <strong>land immediately</strong></li></ol></div>
<div class="card" style="border-left:4px solid var(--red)"><h3>🔒 Fixed RPM (Won't Change With Power)</h3>
<p>Follow the same checklist. If switching the ECU doesn't resolve it → <strong>terminate the flight</strong>.</p></div>
<div class="section-divider"></div>
<div class="card" style="border-left:4px solid var(--amber);background:var(--amber-bg)"><h3>💀 Engine Failure Below 3,000 ft — MEMORY ITEMS</h3>
<ul class="checklist" id="mem">
<li onclick="ck(this)"><span class="ck"></span><strong>Power lever — MAX</strong></li>
<li onclick="ck(this)"><span class="ck"></span><strong>Maintain directional control</strong></li>
<li onclick="ck(this)"><span class="ck"></span><strong>Airspeed — V<sub>SC</sub></strong></li>
<li onclick="ck(this)"><span class="ck"></span><strong>Gear — UP</strong></li>
<li onclick="ck(this)"><span class="ck"></span><strong>Flaps — UP</strong></li>
<li onclick="ck(this)"><span class="ck"></span><strong>SECURE the engine</strong></li>
</ul>
<div class="keyfact" style="margin-top:14px">🦶 <strong>Identify:</strong> Dead foot = dead engine → <strong>Verify:</strong> Pull throttle back → <strong>Fix:</strong> Engine master OFF (feathers prop) → <strong>Secure:</strong> Alternator OFF, fuel pump OFF, fuel selector OFF</div></div>
<div class="card"><h3>🔄 Restart With Starter</h3>
<p><strong>Altitude:</strong> ≤18,000 ft (immediate) or ≤10,000 ft (within 2 min)<br><strong>Airspeed:</strong> Below <strong>100 KIAS</strong></p>
<ol class="steps"><li>Power lever — IDLE</li><li>Fuel selector — ON</li><li>Alternate air — as required</li><li>Alternator — ON</li><li>Engine Master — ON (unfeathers prop)</li><li>Starter — ON</li><li>Check circuit breakers</li></ol></div>
<div class="card"><h3>💨 Windmilling Restart</h3>
<p><strong>Airspeed window: 125 – 145 KIAS</strong> (must be in this range)</p>
<ol class="steps"><li>Power lever — IDLE</li><li>Fuel selector — ON</li><li>Alternate air — as required</li><li>Alternator — ON</li><li>Engine Master — ON → prop unfeathers and restarts by windmilling</li></ol></div>
<div class="quiz" id="q9"><div class="quiz-tag">✓ Knowledge Check</div>
<p class="q">What is the maximum propeller overspeed RPM and duration?</p>
<div class="opts">
<div class="opt" onclick="ans(this,'q9',0)"><span class="letter">A</span>2,000 RPM for 30 seconds</div>
<div class="opt" onclick="ans(this,'q9',1)"><span class="letter">B</span>2,500 RPM for 20 seconds</div>
<div class="opt" onclick="ans(this,'q9',0)"><span class="letter">C</span>3,000 RPM for 10 seconds</div>
</div><div class="feedback" id="q9f"></div></div>
<div class="quiz" id="q10"><div class="quiz-tag">✓ Knowledge Check</div>
<p class="q">For a windmilling restart, airspeed must be between:</p>
<div class="opts">
<div class="opt" onclick="ans(this,'q10',0)"><span class="letter">A</span>80 – 100 KIAS</div>
<div class="opt" onclick="ans(this,'q10',0)"><span class="letter">B</span>100 – 120 KIAS</div>
<div class="opt" onclick="ans(this,'q10',1)"><span class="letter">C</span>125 – 145 KIAS</div>
</div><div class="feedback" id="q10f"></div></div>
<div class="section-divider"></div>
<div class="card" style="text-align:center;border-color:var(--green)">
<div style="font-size:48px;margin-bottom:12px">🎖️</div>
<h3 style="color:var(--green);font-size:20px">Course Complete</h3>
<p id="final" style="font-size:32px;font-weight:800;color:var(--navy);margin:12px 0">0 / 10</p>
<p>Review any modules you want to revisit using the ← Previous button. Then go watch the <a href="https://www.youtube.com/watch?v=YjscP5juA5c" target="_blank" style="color:var(--sky)">original video</a> and review the Embry-Riddle propeller diagrams.</p></div>`}
];

let cur=0,score=0,total=0;const done=new Set();
function render(){
  const m=MODULES[cur];
  let h=`<div class="module"><div class="module-label">${m.label}</div><h2>${m.title}</h2><p class="subtitle">${m.sub}</p>${m.html}</div>`;
  document.getElementById('main').innerHTML=h;
  document.getElementById('nav-center').innerHTML=`Module <strong>${cur+1}</strong> of ${MODULES.length}`;
  document.getElementById('bp').disabled=cur<=0;
  document.getElementById('bn').disabled=cur>=MODULES.length-1;
  document.getElementById('progress-bar').style.width=(cur/(MODULES.length-1)*100)+'%';
  window.scrollTo({top:0,behavior:'smooth'});
}
function go(d){const n=cur+d;if(n>=0&&n<MODULES.length){cur=n;render();}}
function ck(li){li.classList.toggle('done');li.querySelector('.ck').textContent=li.classList.contains('done')?'✓':'';}
const ANSWERS={q1:'Fine pitch = small bite, high RPM. Like a flat hand in water — easy to move but grabs little.',q2:'Fixed pitch is optimized for one speed. At all other speeds, efficiency drops dramatically.',q3:'Feathered = blade edge-on to wind = minimum drag. Critical after engine failure.',q4:'FADEC means the ECU reads the power lever position and sets RPM via the governor. No pilot input on RPM.',q5:'Both props rotate clockwise. PAST factors (P-factor, Accelerated slipstream, Spiraling slipstream, Torque) cause the left engine failure to have the greatest adverse yawing effect.',q6:'More oil pressure pushes blades toward fine pitch — small bite, high RPM, used for takeoff.',q7:'Low pitch stop pins engage below 1,300 RPM, physically preventing the blades from feathering during ground shutdown.',q8:'IDLE first, then Master OFF. This sequence allows oil to drain from the hub so counterweights can push blades to feathered.',q9:'2,500 RPM max for 20 seconds — this is a power plant limitation from the AFM.',q10:'125–145 KIAS. Too slow and the prop won\'t windmill. Too fast and structural limits may be exceeded.'};
function ans(el,qid,correct){
  if(done.has(qid))return;done.add(qid);total++;
  const fb=document.getElementById(qid+'f');
  const opts=el.parentElement.querySelectorAll('.opt');
  if(correct){score++;el.classList.add('correct');fb.className='feedback show pass';fb.innerHTML='✅ <strong>Correct!</strong> '+ANSWERS[qid];}
  else{el.classList.add('wrong');opts.forEach(o=>{if(o.getAttribute('onclick').includes(',1)')){o.classList.add('correct');}});fb.className='feedback show fail';fb.innerHTML='❌ <strong>Not quite.</strong> '+ANSWERS[qid];}
  opts.forEach(o=>o.style.pointerEvents='none');
  document.getElementById('sc').textContent=score+' / '+total;
  if(document.getElementById('final'))document.getElementById('final').textContent=score+' / 10';
}
let speaking=false,audio=null;
async function speak(){
  const t=MODULES[cur].speak;if(!t)return;
  if(speaking&&audio){audio.pause();audio=null;speaking=false;document.getElementById('tts').classList.remove('on');document.getElementById('bs').textContent='🔊 Narrate';return;}
  speaking=true;document.getElementById('tts').classList.add('on');document.getElementById('bs').textContent='⏹ Stop';
  try{
    const r=await fetch('http://localhost:8100/v1/audio/speech',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'chatterbox',voice:'kirk',input:t,response_format:'mp3'})});
    if(!r.ok)throw new Error('TTS error');
    const b=await r.blob(),u=URL.createObjectURL(b);audio=new Audio(u);
    audio.onended=()=>{URL.revokeObjectURL(u);speaking=false;audio=null;document.getElementById('tts').classList.remove('on');document.getElementById('bs').textContent='🔊 Narrate';};
    await audio.play();
  }catch(e){speaking=false;document.getElementById('tts').classList.remove('on');document.getElementById('bs').textContent='🔊 Narrate';const u=new SpeechSynthesisUtterance(t);u.rate=.9;u.pitch=.8;u.onend=()=>{document.getElementById('bs').textContent='🔊 Narrate';};speechSynthesis.speak(u);document.getElementById('bs').textContent='⏹ Stop';}
}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(1);if(e.key==='ArrowLeft')go(-1);if(e.key==='s'||e.key==='S')speak();});
render();
</script>
</body>
